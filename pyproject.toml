[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oscar-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing OSCAR CPAP therapy data to LLM clients"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
oscar-mcp = "oscar_mcp.server:main"

[tool.setuptools.packages.find]
include = ["oscar_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pinned so lint results do not drift as ruff's defaults change between
# releases. Timezone rules (DTZ) are deliberately absent: OSCAR records local
# wall-clock time, and forcing tz-aware datetimes would shift therapy dates.
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]
